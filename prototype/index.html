    "text": "📚✨ MFU Book Fair 2026 เปิดโลกการอ่าน เติมเต็มประสบการณ์การเรียนรู้!\\n\\nชวนทุกคนมาร่วมสัมผัสบรรยากาศมหกรรมหนังสือ MFU Book Fair 2026 พบกับหนังสือหลากหลายประเภทจากร้านหนังสือและสำนักพิมพ์ชั้นนำ ทั้งหนังสือวิชาการ หนังสือทั่วไป และสื่อการเรียนรู้ พร้อมกิจกรรมพิเศษที่ชวนมาเรียนรู้ ทดลอง และสร้างสรรค์ประสบการณ์ใหม่ ๆ\\n\\nภายในงานยังมีกิจกรรมหลากหลาย อาทิ\\n📖 เลือกชมและแนะนำหนังสือเข้าห้องสมุด\\n🎤 พบกับกิจกรรมพิเศษและการพูดคุยแลกเปลี่ยนความรู้\\n💻 เข้าร่วม Online Database Workshop\\n🎨 สนุกกับกิจกรรมสร้างสรรค์และกิจกรรมรักษ์สิ่งแวดล้อม\\n🎲 เปิดประสบการณ์การเรียนรู้ผ่านเกมและกิจกรรมต่าง ๆ\\n\\nมาร่วมเปิดหน้าหนังสือใหม่ ๆ ค้นหาแรงบันดาลใจ และเก็บเกี่ยวประสบการณ์ดี ๆ ไปด้วยกัน แล้วพบกันที่ MFU Book Fair 2026!\\n\\n++++++++++++\\n\\n☺ ติดตามข้อมูลเพิ่มเติมได้ที่ Facebook Page: MFU Library หรือ  Website Book Fair\\n\\n#MFUBookFair2026 #OnePageOneChange #MFULibrary #อย่าลืมพกถุงผ้า \\n#DontForgetYourToteBag",\r

      "text": "📚✨ MFU Book Fair 2026 เปิดโลกการอ่าน เติมเต็มประสบการณ์การเรียนรู้!\\n\\nชวนทุกคนมาร่วมสัมผัสบรรยากาศมหกรรมหนังสือ MFU Book Fair 2026 พบกับหนังสือหลากหลายประเภทจากร้านหนังสือและสำนักพิมพ์ชั้นนำ ทั้งหนังสือวิชาการ หนังสือทั่วไป และสื่อการเรียนรู้ พร้อมกิจกรรมพิเศษที่ชวนมาเรียนรู้ ทดลอง และสร้างสรรค์ประสบการณ์ใหม่ ๆ\\n\\nภายในงานยังมีกิจกรรมหลากหลาย อาทิ\\n📖 เลือกชมและแนะนำหนังสือเข้าห้องสมุด\\n🎤 พบกับกิจกรรมพิเศษและการพูดคุยแลกเปลี่ยนความรู้\\n💻 เข้าร่วม Online Database Workshop\\n🎨 สนุกกับกิจกรรมสร้างสรรค์และกิจกรรมรักษ์สิ่งแวดล้อม\\n🎲 เปิดประสบการณ์การเรียนรู้ผ่านเกมและกิจกรรมต่าง ๆ\\n\\nมาร่วมเปิดหน้าหนังสือใหม่ ๆ ค้นหาแรงบันดาลใจ และเก็บเกี่ยวประสบการณ์ดี ๆ ไปด้วยกัน แล้วพบกันที่ MFU Book Fair 2026!\\n\\n++++++++++++\\n\\n☺ ติดตามข้อมูลเพิ่มเติมได้ที่ Facebook Page: MFU Library หรือ  Website Book Fair\\n\\n#MFUBookFair2026 #OnePageOneChange #MFULibrary #อย่าลืมพกถุงผ้า #DontForgetYourToteBag",\r

      "text": "ไม่ต้องบินไปไหน ก็เปิดมุมมองข้ามวัฒนธรรมได้!\\n\\n(English Below)\\n\\nชวนชาว มฟล. มาคุย แลกเปลี่ยน และทำความรู้จักเพื่อนใหม่\\nในกิจกรรม Global Dialogues: CO-EXISTING\\n\\nส่วนพัฒนาความสัมพันธ์ระหว่างประเทศ ร่วมกับทีมนักศึกษาต่างชาติ \\nขอชวนนักศึกษาไทยและนักศึกษาต่างชาติ มาร่วมเรียนรู้การอยู่ร่วมกัน\\nท่ามกลางความหลากหลาย ผ่านวงคุยและกิจกรรมสนุก ๆ \\nในบรรยากาศเป็นกันเอง ภายใต้กิจกรรม Global Dialogues: CO-EXISTING \\nรายละเอียดการจัดกิจกรรมด้านล่างนี้เลย\\n\\n📅 วันที่จัดกิจกรรม: 15 พฤศจิกายน 2026\\n⏰ เวลา: 08:30 – 15:00 น.\\n📍 สถานที่จัดกิจกรรม: Networking Space (M for U Centre) ชั้น 2 อาคาร E-Park (M-Square)\\n\\nกิจกรรมนี้เหมาะกับใคร\\n✅ อยากลองสัมผัสบรรยากาศการเรียนรู้ร่วมกับเพื่อนจากหลากหลายประเทศ\\n✅ อยากเปิดมุมมองใหม่ ๆ และก้าวออกจาก Comfort Zone\\n✅ อยากฝึกภาษาอังกฤษ และเรียนรู้ภาษาของเพื่อน\\n✅ อยากเข้าใจเพื่อนต่างชาติและเพื่อนคนไทยให้มากขึ้น\\n \\nกิจกรรมไฮไลท์ \\n📌 Panel Discussion: วงคุยสบาย ๆ ที่ชวนแลกเปลี่ยนประสบการณ์\\n     และมุมมองเรื่องการอยู่ร่วมกัน\\n📌 Interactive Cross-Cultural Workshop: เวิร์กช็อปที่เปิดโอกาสให้ทุกคน\\n     ได้พูดคุยและเรียนรู้ข้ามวัฒนธรรม\\n📌 Scenario-Based Activities: พื้นที่ให้ลองคิดและแก้ไขสถานการณ์จำลอง\\n     จากเรื่องราวที่เกิดขึ้นจริงไปด้วยกัน\\n\\nเปิดรับทั้งนักศึกษาไทย และนักศึกษาต่างชาติ รับรองว่าจะได้รู้อะไรใหม่ๆ \\nมุมมองใหม่ๆ และสนุกไปกับเพื่อนใหม่แน่นอน\\n\\n▶️ งานนี้มีข้าวกลางวันเลี้ยงและแถมยังได้ MFU 333 ด้วยนะจ๊ะ \\n▶️ ใครสนใจรีบลงทะเบียนเลย ก่อนหมดเขต 9 พ.ย.69 นี้ \\n▶️ รับจำนวนจำกัดเพียง 70 คนเท่านั้น\\nลิ้งค์ลงทะเบียน https://scholarship-mfu.vercel.app/#register \\n\\nดูข้อมูลเพิ่มเติมเกี่ยวกับกิจกรรมได้ที่: https://scholarship-mfu.vercel.app/ \\nหรือสอบถามข้อมูลเพิ่มเติมได้ที่: อีเมล์ m4u.global@mfu.ac.th  \\nหรือ โทร. 0-5391-6983\\n-----------------------------------------------------------------------\\n\\nExplore new cultures without catching a flight!\\nCalling all MFU students! Come and share your perspectives, exchange ideas, and make new friends at Global Dialogues: CO-EXISTING\\n\\nThe Global Relations Division, together with a team of international students, invites Thai and international students to explore what it means to live together in a diverse community through friendly conversations and fun, interactive activities.\\n📅 Date: 15 November 2026\\n⏰ Time: 08:30–15:00\\n📍 Venue: Networking Space (M for U Centre), 2nd Floor, E-Park Building (M-Square)\\n\\nWho is this event for?\\nAnyone who wants to:\\n✅ Experience learning alongside friends from different countries\\n✅ Discover new perspectives and step outside their comfort zone\\n✅ Practise English and learn a little of their friends’ languages\\n✅ Better understand both Thai and international friends\\n\\nEvent Highlights\\n📌 Panel Discussion: A relaxed conversation where speakers share experiences and perspectives on living together in a diverse community.\\n📌 Interactive Cross-Cultural Workshop: An opportunity for everyone to connect, exchange ideas, and learn across cultures.\\n📌 Scenario-Based Activities: Work together to explore and respond to simulated situations inspired by real-life experiences.\\n\\nWhether you are a Thai or international student, join us to discover something new, broaden your perspectives, and have fun with new friends!\\n\\n▶️ Lunch and MFU 333 provided\\n▶️ Limited to 70 participants\\n▶️ Register by 9 November 2026\\nRegister and find out more:\\nhttps://scholarship-mfu.vercel.app/\\n\\nFor enquiries:\\nEmail: m4u.global@mfu.ac.th\\nTel: 053-916-983",\r

    "caption": "“There was a bad break up, sort of. It was eight months ago. I’m past it now. But I had to experience that for the first time. I don’t think I handled it as well as I could. At the time I couldn’t grasp that maybe it wasn’t anybody’s fault. Maybe I just wanted to be with the person for longer than they wanted to be with me. But accepting things that you don’t want to happen is really, really hard. It’s like: ‘Why do they get to walk around, and keep living their life, while I’m miserable all the time?’ It didn’t seem fair. So I might have reacted in a way that was disproportionate, to make the person feel more guilty than they needed to. Sometimes that’s your only recourse when someone hurts you: feeling aggrieved, and making it known. Not that it keeps you from suffering. But there is a sense of power in it. It allows you to redistribute the pain that you’re feeling. You can make their life a hassle for a bit, hurt their feelings, tell everyone they’re a big asshole. When the truth is: maybe they were just living their life, trying their best, and you got hurt. There’s not always a villain. Sometimes you just get fucked up by somebody exercising their own autonomy.”",\r
